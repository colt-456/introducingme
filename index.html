<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS. PROFILE - HUD STUDIO</title>
    <link rel="stylesheet" href="style.css">
    <!-- PNG 저장을 위한 html2canvas 라이브러리 -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- 제어 패널 (SF 테마) -->
        <aside class="control-panel">
            <h1 class="panel-header">SYS. PROFILE</h1>
            
            <div class="control-group">
                <label class="sf-label">LAYOUT & EXPORT</label>
                <div class="button-row">
                    <button id="btn-horizontal" class="sf-btn active">가로형</button>
                    <button id="btn-vertical" class="sf-btn">세로형</button>
                    <button id="btn-download" class="sf-btn highlight">PNG 저장</button>
                </div>
            </div>

            <div class="control-group">
                <label class="sf-label">TYPOGRAPHY</label>
                <div class="input-row">
                    <select id="font-selector" class="sf-select">
                        <option value="D2Coding">D2Coding</option>
                        <option value="Orbit">Orbit</option>
                        <option value="EllisDigitalCoding">Elice Digital</option>
                        <option value="IntelOneMono">Intel One Mono</option>
                        <option value="CloudSansCode">Goorm Sans Code</option>
                    </select>
                </div>
                <div class="input-row" style="margin-top: 10px;">
                    <span class="sf-text-small">글꼴 크기 (px)</span>
                    <input type="number" id="font-size-input" class="sf-input" value="16" min="10" max="100">
                </div>
            </div>

            <div class="control-group">
                <label class="sf-label">PROFILE IMAGE</label>
                <input type="file" id="image-upload" class="sf-file-input" accept="image/*">
                <p class="sf-help-text">* 마우스 휠로 확대/축소, 드래그로 위치 조절이 가능합니다.</p>
            </div>
        </aside>

        <!-- 미리보기 및 편집 영역 -->
        <main class="preview-area">
            <!-- 캡처 대상 영역 -->
            <div id="capture-area" class="hud-card horizontal">
                
                <!-- 수정된 워터마크: 시스템 장식처럼 얇고 작게 우측 상단 배치 -->
                <div class="hud-watermark">SYS.OP // <span>@COLT</span></div>
                
                <div class="hud-left">
                    <div class="profile-img-box">
                        <img id="profile-preview" src="" alt="">
                        <div class="img-overlay-ui"></div>
                    </div>
                    
                    <!-- 한줄소개와 연락방법을 프로필 이미지 바로 아래로 배치 -->
                    <div class="intro-contact-section">
                        <div class="editable-text custom-font" contenteditable="true" data-default="취향과 이야기를 이곳에 기록합니다.">취향과 이야기를 이곳에 기록합니다.</div>
                        <div class="editable-text custom-font text-dim" contenteditable="true" data-default="연락은 DM 또는 멘션으로 받습니다.">연락은 DM 또는 멘션으로 받습니다.</div>
                    </div>
                </div>

                <div class="hud-right">
                    <div class="info-grid">
                        <div class="hud-box">
                            <div class="box-title"><span class="box-num">01</span> INFO</div>
                            <div class="box-content editable-text custom-font" contenteditable="true" data-default="좋아하는 이야기를 나눕니다. 서로의 취향을 존중합니다.">좋아하는 이야기를 나눕니다.<br>서로의 취향을 존중합니다.</div>
                        </div>
                        <div class="hud-box">
                            <div class="box-title"><span class="box-num">02</span> NG / NOTICE</div>
                            <div class="box-content editable-text custom-font" contenteditable="true" data-default="서로의 경계를 존중합니다.">서로의 경계를 존중합니다.</div>
                        </div>
                        <div class="hud-box full-width">
                            <div class="box-title"><span class="box-num">03</span> DETAILS</div>
                            <div class="box-content editable-text custom-font" contenteditable="true" data-default="여기에 상세 정보나 장르, 플레이 스타일 등을 자유롭게 적어주세요.">여기에 상세 정보나 장르, 플레이 스타일 등을 자유롭게 적어주세요.</div>
                        </div>
                    </div>
                </div>
                
                <!-- 데코레이션 요소 -->
                <div class="hud-decoration top-left"></div>
                <div class="hud-decoration bottom-right"></div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
